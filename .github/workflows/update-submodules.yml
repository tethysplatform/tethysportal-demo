name: Update Submodules

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update-submodules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive
          fetch-depth: 0

      - name: Commit configuration
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Update submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --remote

      - name: Commit and push
        id: commit
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No submodule pointer changes."
            echo "changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git diff --cached --submodule=short
          git commit -m "Update submodules"
          git push origin main
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "changes=true" >> $GITHUB_OUTPUT

      - name: Trigger Image Build
        if: steps.commit.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run demo-portal.yml --ref main

      - name: Wait for build
        if: steps.commit.outputs.changes == 'true'
        timeout-minutes: 90
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          RUN_ID=""
          for i in $(seq 1 18); do
            RUN_ID=$(gh run list --workflow demo-portal.yml --limit 20 \
              --json databaseId,headSha,event \
              --jq "[.[] | select(.headSha==\"$SHA\" and .event==\"workflow_dispatch\")][0].databaseId") || RUN_ID=""
            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
              break
            fi
            RUN_ID=""
            echo "Build run for $SHA not visible yet (attempt $i/18)..."
            sleep 10
          done

          if [ -z "$RUN_ID" ]; then
            echo "::error::No build run found for $SHA"
            exit 1
          fi

          echo "Watching build $RUN_ID"
          gh run watch "$RUN_ID" --exit-status --interval 30

      - name: Deploy
        if: steps.commit.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "Demo Portal Dev Deploy" --ref main \
            -f image_tag=${{ steps.commit.outputs.sha }}

      - name: Wait for deploy
        if: steps.commit.outputs.changes == 'true'
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 15
          DEPLOY_ID=$(gh run list --workflow "Demo Portal Dev Deploy" --limit 5 \
            --json databaseId,event \
            --jq '[.[] | select(.event=="workflow_dispatch")][0].databaseId')

          if [ -z "$DEPLOY_ID" ] || [ "$DEPLOY_ID" = "null" ]; then
            echo "::error::Could not find a dispatched deploy run to watch"
            exit 1
          fi

          echo "Watching deploy $DEPLOY_ID"
          gh run watch "$DEPLOY_ID" --exit-status --interval 20

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.commit.outputs.changes }}" != "true" ]; then
            echo "No submodule pointer changes - nothing built or deployed." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "Deployed image tag: \`${{ steps.commit.outputs.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Submodule pointers moved" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          git diff HEAD~1 HEAD --submodule=short >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY