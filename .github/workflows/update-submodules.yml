name: Update Submodules

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update-submodules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive
          fetch-depth: 0

      - name: Commit configuration
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Update submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --remote

      - name: Check for changes
        id: changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changes == 'true'
        id: commit
        run: |
          git add -A
          git commit -m "Update submodules"
          git push origin main
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Trigger Image Build
        if: steps.changes.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run demo-portal.yml --ref main
        
      - name: Wait for build
        if: steps.changes.outputs.changes == 'true'
        timeout-minutes: 90
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          for i in $(seq 1 18); do
            RUN_ID=$(gh run list --workflow demo-portal.yml --limit 20 \
              --json databaseId,headSha,event \
              --jq "[.[] | select(.headSha==\"$SHA\" and .event==\"workflow_dispatch\")][0].databaseId")
            [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ] && break
            sleep 10
          done
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::No build run found for $SHA"
            exit 1
          fi
          echo "Watching build $RUN_ID"
          gh run watch "$RUN_ID" --exit-status --interval 30

      - name: Deploy
        if: steps.changes.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "Demo Portal Dev Deploy" --ref main \
            -f image_tag=${{ steps.commit.outputs.sha }}